server {
    server_name yizhiji.jianglang1892.xyz;

    client_max_body_size 70m;

    location ^~ /cases/ {
        alias /srv/yizhiji/current/dist/standalone/dist/client/cases/;
        include /etc/nginx/mime.types;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/yizhiji.jianglang1892.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yizhiji.jianglang1892.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = yizhiji.jianglang1892.xyz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name yizhiji.jianglang1892.xyz;
    return 404;
}
